# Local dev infrastructure for Sentezy (Phase 6 — local end-to-end).
#
# Brings up the Redis Streams queue and the Python worker so a reel can be
# driven through the full pipeline locally. The api (Node 20) and web (Node 24)
# run on the host for hot-reload — see infra/README.md.
#
#   docker compose -f infra/docker-compose.yml up -d redis     # queue only
#   docker compose -f infra/docker-compose.yml up --build      # redis + worker + reel-renderer
#
# The worker reads all secrets from the repo-root .env. Its REDIS_URL is
# overridden to reach the redis service over the compose network. The worker renders
# the full reel (avatar + B-roll + captions + motion graphics) on the reel-renderer
# service (Node + Chromium + FFmpeg + the @sentezy/remotion bundle), which streams
# the opaque H.264 mp4 back over the compose network — no R2/Cloudflare needed locally.

name: sentezy

services:
  redis:
    image: redis:7-alpine
    container_name: sentezy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Host port 6380: a Homebrew redis commonly owns 127.0.0.1:6379 on macOS,
      # which silently splits the queue (API → host redis, worker → this one).
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Remotion reel renderer (Node + Chromium + FFmpeg + the @sentezy/remotion bundle).
  # No R2 env → it streams the opaque reel mp4 back inline over the compose network.
  # Build context is the repo root (the Dockerfile COPYs packages/remotion).
  reel-renderer:
    build:
      context: ..
      dockerfile: infra/cloudflare/reel-renderer/container/Dockerfile
    container_name: sentezy-reel-renderer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: ../apps/worker
    container_name: sentezy-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Reach redis over the compose network, not localhost.
      REDIS_URL: redis://redis:6379
      # Remotion is the FULL compositor (avatar + B-roll + captions + motion graphics → opaque
      # video); ffmpeg only muxes the audio bed. The renderer runs on the reel-renderer service
      # (its /render-reel), so the finished mp4 matches the in-browser <Player> preview exactly.
      REEL_RENDERER_URL: http://reel-renderer:8080
    depends_on:
      redis:
        condition: service_healthy
      reel-renderer:
        condition: service_healthy

volumes:
  redis-data:
