[project]
name = "sentezy-worker"
version = "0.0.0"
description = "Sentezy video worker — Redis Streams consumer that renders reels (ElevenLabs → HeyGen → ffmpeg → R2/Cloudflare Images)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "redis>=5.2.1",
    "psycopg[binary]>=3.2.3",
    "httpx>=0.28.1",
    "boto3>=1.35.90",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.8.4"]

[tool.ruff]
line-length = 100
target-version = "py312"
